<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Massawe Phone Accessories - Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: #f4f6f8;
    }
    h1 { color: #172554; }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
    }
    button {
      background: #172554;
      color: white;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
    .delete { background: #b91c1c; }
    #status { font-weight: bold; }
    .product {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <h1>Massawe Phone Accessories</h1>
  <p id="status">Connecting to Firebase...</p>

  <section id="login" class="card">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Admin email" required>
      <input id="password" type="password"
        placeholder="Admin password" required>
      <button type="submit">Login</button>
    </form>
    <p id="loginMessage"></p>
  </section>

  <section id="dashboard" hidden>
    <div class="card">
      <h2>Add Product</h2>
      <form id="productForm">
        <input id="name" placeholder="Product name" required>
        <input id="price" type="number" min="0"
          placeholder="Price in TZS" required>
        <input id="image" type="url"
          placeholder="Product image URL" required>
        <button type="submit">Save Product</button>
      </form>
      <p id="productMessage"></p>
      <button id="logout">Logout</button>
    </div>

    <div class="card">
      <h2>Products in Firebase</h2>
      <div id="products">Loading products...</div>
    </div>
  </section>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      deleteDoc,
      doc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCB6CY1gJ9AkU0130c36XeSA6CVlAKS6Wk",
      authDomain: "massawe-phone-accessories.firebaseapp.com",
      projectId: "massawe-phone-accessories",
      storageBucket: "massawe-phone-accessories.firebasestorage.app",
      messagingSenderId: "1027259580485",
      appId: "1:102725958048:web:65fcfb51dd7952f84e232c",
      measurementId: "G-R4HND9LQCD"
    };

    const ADMIN_UID = "m1rFXXjbXTTUxselWqK7rD3i7H23";

    const status = document.getElementById("status");
    const login = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const loginMessage = document.getElementById("loginMessage");
    const productMessage = document.getElementById("productMessage");
    const productsDiv = document.getElementById("products");

    let auth;
    let db;

    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);

      status.textContent = "Firebase initialized. Checking connection...";

      // Test reading the public products collection.
      await getDocs(collection(db, "products"));
      status.textContent = "Connected to Firebase successfully!";
      status.style.color = "green";

    } catch (error) {
      status.textContent = "Firebase connection failed: " + error.message;
      status.style.color = "red";
      console.error(error);
    }

    document.getElementById("loginForm").addEventListener(
      "submit", async (event) => {
        event.preventDefault();
        loginMessage.textContent = "Logging in...";

        try {
          await signInWithEmailAndPassword(
            auth,
            document.getElementById("email").value.trim(),
            document.getElementById("password").value
          );
          loginMessage.textContent = "";
        } catch (error) {
          loginMessage.textContent = "Login failed: " + error.message;
        }
      }
    );

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        login.hidden = false;
        dashboard.hidden = true;
        return;
      }

      if (user.uid !== ADMIN_UID) {
        await signOut(auth);
        loginMessage.textContent =
          "This account is not authorized as admin.";
        return;
      }

      login.hidden = true;
      dashboard.hidden = false;
      await loadProducts();
    });

    async function loadProducts() {
      productsDiv.textContent = "Loading products...";

      try {
        const snapshot = await getDocs(collection(db, "products"));
        productsDiv.replaceChildren();

        if (snapshot.empty) {
          productsDiv.textContent = "No products saved yet.";
          return;
        }

        snapshot.forEach((item) => {
          const data = item.data();
          const row = document.createElement("div");
          row.className = "product";

          const title = document.createElement("strong");
          title.textContent = data.name || "Unnamed product";

          const price = document.createElement("p");
          price.textContent =
            "TZS " + Number(data.price || 0).toLocaleString();

          const image = document.createElement("a");
          image.href = data.image || "#";
          image.textContent = "View product image";
          image.target = "_blank";
          image.rel = "noopener noreferrer";

          const remove = document.createElement("button");
          remove.className = "delete";
          remove.textContent = "Delete product";

          remove.addEventListener("click", async () => {
            if (!confirm("Delete this product?")) return;

            try {
              await deleteDoc(doc(db, "products", item.id));
              await loadProducts();
            } catch (error) {
              alert("Delete failed: " + error.message);
            }
          });

          row.append(title, price, image, remove);
          productsDiv.appendChild(row);
        });
      } catch (error) {
        productsDiv.textContent = "Could not load products: " + error.message;
      }
    }

    document.getElementById("productForm").addEventListener(
      "submit", async (event) => {
        event.preventDefault();
        productMessage.textContent = "Saving product...";

        try {
          await addDoc(collection(db, "products"), {
            name: document.getElementById("name").value.trim(),
            price: Number(document.getElementById("price").value),
            image: document.getElementById("image").value.trim(),
            createdAt: serverTimestamp()
          });

          productMessage.textContent = "Product saved to Firebase!";
          event.target.reset();
          await loadProducts();
        } catch (error) {
          productMessage.textContent = "Save failed: " + error.message;
        }
      }
    );

    document.getElementById("logout").addEventListener(
      "click", () => signOut(auth)
    );
  </script>
</body>
</html>
